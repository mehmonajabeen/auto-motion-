<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Auto Motion - Settings</title>
<link rel="stylesheet" href="setting.css">
</head>

<body>

<div class="container">

<h1>⚙ Settings</h1>

<!-- Account -->
<div class="section">
<h2>👤 Account</h2>

<label>Full Name</label>
<input type="text" placeholder="Enter your name">

<label>Email</label>
<input type="email" placeholder="Enter your email">

<label>Password</label>
<input type="password" placeholder="New Password">

<button class="save">💾 Save Account</button>
</div>

<!-- Appearance -->
<div class="section">
<h2>🎨 Appearance</h2>

<div class="setting">
<span>🌙 Dark Mode</span>
<label class="switch">
<input type="checkbox" id="darkMode">
<span class="slider"></span>
</label>
</div>

<div class="setting">
<span>🌍 Language</span>

<select>
<option>English</option>
<option>Urdu</option>
<option>Arabic</option>
<option>Korean</option>
</select>

</div>

</div>

<!-- Notifications -->
<div class="section">

<h2>🔔 Notifications</h2>

<div class="setting">
<span>Email Notifications</span>

<label class="switch">
<input type="checkbox" checked>
<span class="slider"></span>
</label>

</div>

<div class="setting">
<span>Push Notifications</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>

</div>

</div>

<!-- Privacy -->

<div class="section">

<h2>🔒 Privacy</h2>

<button class="menu-btn">
Privacy Policy
</button>

<button class="menu-btn">
Terms & Conditions
</button>

<button class="menu-btn">
Blocked Users
</button>

</div>

<!-- Help -->

<div class="section">

<h2>❓ Help Center</h2>

<button class="menu-btn">
FAQs
</button>

<button class="menu-btn">
Contact Support
</button>

<button class="menu-btn">
Report a Problem
</button>

</div>

<!-- About -->

<div class="section">

<h2>ℹ About</h2>

<p><b>AI Auto Motion</b></p>

<p>Version 1.0</p>

<p>Create AI videos with one click.</p>

</div>

<!-- Logout -->

<button class="logout" onclick="logout()">
🚪 Logout
</button>

</div>

<script src="settings.js"></script>

</body>
</html>
