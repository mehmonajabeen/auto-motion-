<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Auto Motion - Library</title>
<link rel="stylesheet" href="library.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="logo">
        <h2>🎬 AI Motion</h2>
    </div>

    <ul>
        <li><a href="home.html">🏠 Home</a></li>
        <li><a href="index.html">🎥 AI Generator</a></li>
        <li class="active"><a href="library.html">📚 Library</a></li>
        <li><a href="recent.html">🕒 Recent</a></li>
        <li><a href="profile.html">👤 Profile</a></li>
        <li><a href="settings.html">⚙ Settings</a></li>
    </ul>
</div>

<!-- Main -->
<div class="main">

    <div class="topbar">
        <h1>📚 My Library</h1>

        <input type="text" placeholder="🔍 Search Projects...">

        <button class="new-btn">
            + New Project
        </button>
    </div>

    <!-- Categories -->
    <div class="tabs">
        <button class="tab active">All</button>
        <button class="tab">Favorites</button>
        <button class="tab">Recent</button>
        <button class="tab">Completed</button>
        <button class="tab">Processing</button>
        <button class="tab">Trash</button>
    </div>

    <!-- Projects -->
    <div class="projects">

        <div class="project-card">
            <div class="icon">🎥</div>

            <h3>Anime Girl Walking</h3>

            <p>Status:
                <span class="completed">Completed</span>
            </p>

            <p>Created: 5 Aug 2026</p>

            <div class="actions">
                <button>📂 Open</button>
                <button>⭐ Favorite</button>
                <button>✏ Rename</button>
                <button>🗑 Delete</button>
            </div>
        </div>

        <div class="project-card">
            <div class="icon">🎬</div>

            <h3>Cyber City</h3>

            <p>Status:
                <span class="processing">Processing</span>
            </p>

            <p>Created: 4 Aug 2026</p>

            <div class="actions">
                <button>📂 Open</button>
                <button>⭐ Favorite</button>
                <button>✏ Rename</button>
                <button>🗑 Delete</button>
            </div>
        </div>

        <div class="project-card">
            <div class="icon">🌄</div>

            <h3>Nature Scene</h3>

            <p>Status:
                <span class="completed">Completed</span>
            </p>

            <p>Created: 3 Aug 2026</p>

            <div class="actions">
                <button>📂 Open</button>
                <button>⭐ Favorite</button>
                <button>✏ Rename</button>
                <button>🗑 Delete</button>
            </div>
        </div>

    </div>

</div>

<script src="library.js"></script>

</body>
</html>
